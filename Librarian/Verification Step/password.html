<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Step 2: Password Verification</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #1e293b;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            width: 380px;
            text-align: center;
            position: relative;
        }

        /* Avatar styling for identified librarian */
        .librarian-profile {
            width: 80px;
            height: 80px;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            border: 4px solid #eff6ff;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 5px;
            color: #0f172a;
        }

        .role-badge {
            font-size: 0.8rem;
            color: #2563eb;
            background: #eff6ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            margin-bottom: 25px;
            display: inline-block;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #64748b;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="password"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-login {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background: #1d4ed8;
        }

        .error-message {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #64748b;
        }

        /* Shake animation for wrong password */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .apply-shake {
            animation: shake 0.2s ease-in-out 0s 2;
        }
    </style>
</head>
<body>

    <div class="login-card" id="card">
        <div class="librarian-profile">A</div>
        <h1>Welcome back, Alex!</h1>
        <span class="role-badge">Senior Librarian</span>

        <form id="password-form">
            <div class="input-group">
                <label for="password">Enter your password</label>
                <input type="password" id="password" placeholder="••••••••" required autofocus>
            </div>
            
            <button type="submit" class="btn-login">Log in</button>
            <p id="error" class="error-message">Incorrect password. Please try again.</p>
        </form>

        <a href="index.html" class="back-link">Not you? Scan again</a>
    </div>

    <script>
        const loginForm = document.getElementById('password-form');
        const errorMsg = document.getElementById('error');
        const card = document.getElementById('card');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;

            // Simple demonstration check
            // Use "123456" to test the success redirect
            if (password === "123456") {
                // Redirect to the Management folder's dashboard
                window.location.href = "../Management/index.html"; 
            } else {
                errorMsg.style.display = 'block';
                
                // Trigger shake animation
                card.classList.add('apply-shake');
                setTimeout(() => {
                    card.classList.remove('apply-shake');
                }, 400);
            }
        });
    </script>
</body>
</html>
