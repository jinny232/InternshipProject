<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acquisition Stage - LMS</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --border: #cbd5e1;
            --text: #1e293b;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 2.5rem; margin: 0; }
        
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 2.5rem; border-radius: 20px; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        .header { border-bottom: 2px solid var(--bg); padding-bottom: 1.5rem; margin-bottom: 2rem; }
        .step-tag { background: #dbeafe; color: var(--primary); padding: 4px 12px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; font-weight: 600; color: #64748b; }
        
        input[type="text"], input[type="date"], input[type="number"], select { 
            padding: 12px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-size: 0.95rem; 
            outline: none;
            background: #fff;
            box-sizing: border-box;
            width: 100%;
        }

        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        /* Media Assets - Full Fill Style */
        .upload-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }

        .upload-card {
            border: 2px dashed var(--border);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #fdfdfd;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .upload-card:hover { border-color: var(--primary); background: #f0f7ff; }

        .preview-container {
            width: 100%;
            height: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .preview-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Fills the whole dotted area */
            display: none;
        }

        .icon-placeholder { font-size: 2.5rem; transition: 0.2s; }

        .upload-label-bottom {
            padding: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
            background: #f8fafc;
            border-top: 1px solid #f1f5f9;
        }

        /* Overlay when image is loaded */
        .img-overlay {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 0;
            font-size: 0.7rem;
            display: none;
        }

        #ebook_name { font-size: 0.7rem; color: var(--primary); margin-top: 5px; font-weight: 700; max-width: 90%; }

        .footer { margin-top: 3rem; display: flex; justify-content: flex-end; gap: 15px; border-top: 1px solid #f1f5f9; padding-top: 2rem; }
        .btn { padding: 12px 30px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
        .btn-secondary { background: #f1f5f9; color: #64748b; }
        .btn-primary { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="step-tag">Step 1: Add Primary Record</span>
        <h1 style="margin-top: 10px; font-size: 1.6rem;">Book Entry</h1>
    </div>
    <form action="catalogue.html" method="GET" enctype="multipart/form-data">
        <div class="form-grid">
            
            <div class="form-group full-width">
                <label>စာအုပ်အမည် (Book Title) *</label>
                <input type="text" placeholder="Enter title..." required>
            </div>

            <div class="form-group">
                <label>စာအုပ်အမျိုးအစား (Category) *</label>
                <select required>
                    <option value="">-- အမျိုးအစားရွေးပါ --</option>
                    <option>Fiction</option>
                    <option>Non-Fiction</option>
                    <option>Novels</option>
                    <option>Comic/ Journal</option>
                    <option>Magazine/ CD, DVD</option>
                    <option>Newspapers</option>
                    <option>e-Book</option>
                </select>
            </div>

            <div class="form-group">
                <label>ထုတ်ဝေသည့်ခုနှစ် (Publication Year) *</label>
                <input type="date" required>
            </div>

            <div class="form-group">
                <label>အဓိကစာရေးသူ (Key Author) *</label>
                <input type="text" placeholder="Primary author..." required>
            </div>

            <div class="form-group">
                <label>ထုတ်ဝေသည့်အကြိမ် (Edition Number) *</label>
                <input type="number" placeholder="e.g. 1, 12" min="1" step="1" required>
            </div>

            <div class="form-group">
                <label>ဘာသာစကား (Language)</label>
                <input type="text" placeholder="Burmese / English">
            </div>

            <div class="form-group">
                <label>ပညာရပ် (Subject)</label>
                <input type="text" placeholder="Subject field...">
            </div>

            <div class="form-group full-width">
                <label>Media Assets (စာအုပ်နှင့် သက်ဆိုင်သော ဖိုင်များ)</label>
                <div class="upload-section">
                    
                    <div class="upload-card" onclick="document.getElementById('cover_img').click()">
                        <div class="preview-container">
                            <span id="cover_icon" class="icon-placeholder">📸</span>
                            <img id="cover_preview_img" src="#" alt="Preview">
                            <div class="img-overlay" id="cover_overlay">စာအုပ်မျက်နှာဖုံး (Cover Image)</div>
                        </div>
                        <div class="upload-label-bottom" id="cover_base_label">စာအုပ်မျက်နှာဖုံး (Cover Image)</div>
                        <input type="file" id="cover_img" name="cover" hidden accept="image/*" onchange="previewFile(this, 'cover')">
                    </div>

                    <div class="upload-card" onclick="document.getElementById('ebook_file').click()">
                        <div class="preview-container">
                            <div style="text-align:center;">
                                <span id="ebook_icon" class="icon-placeholder">📄</span>
                                <div id="ebook_name" style="display:none;"></div>
                            </div>
                        </div>
                        <div class="upload-label-bottom">e-Book (Digital File)</div>
                        <input type="file" id="ebook_file" name="ebook" hidden accept=".pdf,.epub" onchange="previewFile(this, 'ebook')">
                    </div>
                </div>
            </div>

            <div class="form-group full-width">
                <label>အခြား စာရေးသူ (Other Authors)</label>
                <input type="text" placeholder="List co-authors...">
            </div>
        </div>

        <div class="footer">
            <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">Cancel</button>
            <button type="submit" class="btn btn-primary">Add details →</button>
        </div>
    </form>
</div>

<script>
    function previewFile(input, type) {
        const file = input.files[0];
        if (file) {
            if (type === 'cover') {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('cover_preview_img');
                    const icon = document.getElementById('cover_icon');
                    const overlay = document.getElementById('cover_overlay');
                    const baseLabel = document.getElementById('cover_base_label');
                    
                    img.src = e.target.result;
                    img.style.display = 'block';
                    icon.style.display = 'none';
                    overlay.style.display = 'block';
                    baseLabel.style.display = 'none'; // Hide text label when image fills
                }
                reader.readAsDataURL(file);
            } else if (type === 'ebook') {
                const icon = document.getElementById('ebook_icon');
                const nameBox = document.getElementById('ebook_name');
                icon.innerHTML = "✅";
                icon.style.color = "#10b981";
                nameBox.innerText = file.name;
                nameBox.style.display = 'block';
            }
        }
    }
</script>

</body>
</html>
